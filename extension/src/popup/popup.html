<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comp</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg:            #0d0f0d;
        --bg-header:     #141814;
        --bg-section:    #111311;
        --bg-card:       #161a16;
        --bg-card-hover: #1c221c;
        --green:         #39ff6a;
        --green-dim:     #27b84a;
        --green-muted:   #1a6630;
        --green-faint:   #0f2e18;
        --text:          #c8f5d0;
        --text-dim:      #7ab98a;
        --text-faint:    #4a7a58;
        --border:        #1f3324;
        --border-active: #27b84a;
        --radius-sm:     4px;
        --radius-md:     6px;
        --font-mono:     'Courier New', Courier, monospace;
        --font-sans:     system-ui, -apple-system, sans-serif;
      }

      html, body {
        width: 280px;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        font-size: 13px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .popup-root {
        display: flex;
        flex-direction: column;
        min-height: 100%;
      }

      .loading {
        padding: 24px;
        text-align: center;
        font-family: var(--font-mono);
        color: var(--text-dim);
        font-size: 12px;
      }

      .popup-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px 10px;
        background: var(--bg-header);
        border-bottom: 1px solid var(--border);
      }

      .popup-title {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .popup-logo {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--green);
      }

      .popup-name {
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-dim);
      }

      .toggle-row {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }

      .toggle-label {
        font-size: 11px;
        color: var(--text-dim);
        user-select: none;
      }

      .toggle-input {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
        pointer-events: none;
      }

      .toggle-switch {
        position: relative;
        display: inline-block;
        width: 32px;
        height: 18px;
        background: var(--border);
        border-radius: 18px;
        border: 1px solid var(--border);
        transition: background 0.2s ease, border-color 0.2s ease;
        flex-shrink: 0;
      }

      .toggle-switch--on {
        background: var(--green-muted);
        border-color: var(--green-dim);
      }

      .toggle-thumb {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 12px;
        height: 12px;
        background: var(--text-faint);
        border-radius: 50%;
        transition: transform 0.2s ease, background 0.2s ease;
      }

      .toggle-switch--on .toggle-thumb {
        transform: translateX(14px);
        background: var(--green);
      }

      .popup-nav {
        display: flex;
        border-bottom: 1px solid var(--border);
        background: var(--bg-header);
      }

      .nav-tab {
        flex: 1;
        padding: 8px 0;
        background: transparent;
        border: none;
        border-bottom: 2px solid transparent;
        color: var(--text-faint);
        font-family: var(--font-sans);
        font-size: 12px;
        cursor: pointer;
        transition: color 0.15s ease, border-color 0.15s ease;
        margin-bottom: -1px;
      }

      .nav-tab:hover { color: var(--text-dim); }

      .nav-tab--active {
        color: var(--green);
        border-bottom-color: var(--green-dim);
      }

      .nav-tab:focus-visible {
        outline: 2px solid var(--green);
        outline-offset: -2px;
      }

      .popup-section {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: var(--bg-section);
      }

      .section-hint {
        font-size: 11px;
        color: var(--text-faint);
      }

      .persona-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .persona-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        padding: 12px 8px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        color: var(--text-dim);
        cursor: pointer;
        position: relative;
        transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      }

      .persona-card:hover {
        background: var(--bg-card-hover);
        border-color: var(--green-muted);
        color: var(--text);
      }

      .persona-card--active {
        border-color: var(--border-active);
        background: var(--green-faint);
        color: var(--green);
      }

      .persona-card:focus-visible {
        outline: 2px solid var(--green);
        outline-offset: 2px;
      }

      .persona-emoji {
        font-size: 20px;
        line-height: 1;
      }

      .persona-name {
        font-size: 11px;
        font-family: var(--font-mono);
        letter-spacing: 0.04em;
      }

      .persona-active-dot {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 6px rgba(57, 255, 106, 0.6);
      }

      .persona-tagline {
        font-size: 11px;
        color: var(--text-faint);
        text-align: center;
        font-style: italic;
        min-height: 16px;
      }

      .pref-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .pref-group-label {
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--green-dim);
        font-family: var(--font-mono);
      }

      .pref-group-hint {
        font-size: 11px;
        color: var(--text-faint);
        line-height: 1.6;
      }

      .pref-divider {
        height: 1px;
        background: var(--border);
        margin: 2px 0;
      }

      .hour-select-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .hour-select-label {
        font-size: 12px;
        color: var(--text-dim);
      }

      .hour-select {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text);
        font-family: var(--font-mono);
        font-size: 11px;
        padding: 4px 8px;
        cursor: pointer;
        appearance: none;
        -webkit-appearance: none;
        outline: none;
        min-width: 100px;
        text-align: right;
      }

      .hour-select:focus-visible {
        border-color: var(--green-muted);
        outline: 2px solid var(--green);
        outline-offset: 2px;
      }

      .reset-btn {
        background: transparent;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text-faint);
        font-family: var(--font-sans);
        font-size: 11px;
        padding: 6px 12px;
        cursor: pointer;
        align-self: flex-start;
        transition: border-color 0.15s ease, color 0.15s ease;
      }

      .reset-btn:hover {
        border-color: var(--green-muted);
        color: var(--text-dim);
      }

      .reset-btn:focus-visible {
        outline: 2px solid var(--green);
        outline-offset: 2px;
      }

      .popup-footer {
        padding: 8px 14px;
        border-top: 1px solid var(--border);
        background: var(--bg-header);
        display: flex;
        align-items: center;
        justify-content: flex-end;
        min-height: 30px;
      }

      .footer-version {
        font-size: 10px;
        color: var(--text-faint);
        font-family: var(--font-mono);
      }

      .footer-saved {
        font-size: 10px;
        color: var(--green-dim);
        font-family: var(--font-mono);
        animation: fade-in 0.15s ease;
      }

      @keyframes fade-in {
        from { opacity: 0; }
        to   { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .toggle-thumb,
        .toggle-switch,
        .footer-saved {
          animation: none;
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./Popup.tsx"></script>
  </body>
</html>
